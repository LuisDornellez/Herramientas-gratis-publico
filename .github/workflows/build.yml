name: Build OfiKit
on:
  push:
    branches: ["**"]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m py_compile ofikit.py
      - run: pyinstaller --onefile --noconsole --name OfiKit --icon icon.ico --add-data "icon.ico;." --collect-all customtkinter --hidden-import cryptography --hidden-import openpyxl --hidden-import qrcode ofikit.py
      - uses: actions/upload-artifact@v4
        with:
          name: OfiKit-exe
          path: dist/OfiKit.exe
          if-no-files-found: error
      - name: Adjuntar OfiKit.exe al Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OfiKit.exe
