name: Build OfiKit

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.9"
  PYINSTALLER_VERSION: "6.11.1"
  RELEASE_TAG: exe-latest

jobs:
  build:
    # El .exe de Windows solo se puede generar en Windows (PyInstaller no compila cruzado).
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        id: deps
        run: |
          python -m pip install -r requirements.txt "pyinstaller==${PYINSTALLER_VERSION}"

      - name: Verificar sintaxis
        id: syntax
        run: python -m py_compile ofikit.py

      - name: Compilar OfiKit.exe
        id: exe
        run: |
          pyinstaller --onefile --noconsole --name OfiKit --icon icon.ico \
            --add-data "icon.ico;." --collect-all customtkinter \
            --hidden-import cryptography --hidden-import openpyxl --hidden-import qrcode \
            ofikit.py
          test -f dist/OfiKit.exe

      - name: Calcular SHA256 (opcional)
        id: sha
        continue-on-error: true
        run: |
          sha256sum dist/OfiKit.exe | tee dist/OfiKit.exe.sha256.txt

      - name: Publicar en Releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          FILES="dist/OfiKit.exe"
          [ -f dist/OfiKit.exe.sha256.txt ] && FILES="$FILES dist/OfiKit.exe.sha256.txt"
          gh release create "$RELEASE_TAG" $FILES \
            --target "$GITHUB_SHA" --title "Última compilación" --prerelease \
            --notes "Compilación en curso..."

      - name: Resumen y notas del release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mark() { case "$1" in success) echo "✅ incluido";; skipped) echo "⏭️ omitido";; cancelled) echo "⚠️ cancelado";; *) echo "❌ falló";; esac; }
          {
            echo "## OfiKit — compilación #${GITHUB_RUN_NUMBER}"
            echo
            echo "Commit: \`${GITHUB_SHA::7}\`"
            echo
            echo "| Componente | Estado |"
            echo "|---|---|"
            echo "| Dependencias (versiones fijas) | $(mark '${{ steps.deps.outcome }}') |"
            echo "| Sintaxis de ofikit.py | $(mark '${{ steps.syntax.outcome }}') |"
            echo "| OfiKit.exe | $(mark '${{ steps.exe.outcome }}') |"
            echo "| SHA256 (opcional) | $(mark '${{ steps.sha.outcome }}') |"
            echo "| Publicación en Releases | $(mark '${{ steps.release.outcome }}') |"
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release edit "$RELEASE_TAG" --notes-file notes.md || true
